# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with reference_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920). All data is bundled, so
# every grader is deterministic.
tasks:
  - name: iron_mass
    reference_sql: SELECT elements.main.atomic_mass('Fe') AS atomic_mass
  - name: aspirin_mass
    reference_sql: SELECT round(elements.main.formula_mass('C9H8O4'), 2) AS molar_mass
  - name: noble_gases
    reference_sql: SELECT symbol FROM elements.main.elements WHERE group_number = 18 ORDER BY atomic_number
  - name: oxygen_isotopes
    reference_sql: >-
      SELECT mass_number, isotopic_composition FROM elements.main.isotopes
      WHERE symbol = 'O' AND isotopic_composition IS NOT NULL ORDER BY mass_number
  - name: hydrate_water_percent
    reference_sql: >-
      SELECT round(100 * mass_fraction, 2) AS hydrogen_percent
      FROM elements.main.formula_composition('CuSO4·5H2O') WHERE element = 'H'
  - name: normalize_symbols
    reference_sql: >-
      SELECT elements.main.atomic_number(v) AS atomic_number,
             elements.main.element_symbol(elements.main.atomic_number(v)) AS symbol,
             elements.main.element_name(v) AS name
      FROM (VALUES ('fe'), ('GOLD'), ('na')) t(v) ORDER BY atomic_number
